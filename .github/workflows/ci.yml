# Secret grep + same-level + industry gates
name: liqa-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: pytest same-level + industry
        env:
          LIQA_HOME: ${{ github.workspace }}
        run: python -m pytest tests/test_same_level_contract.py tests/test_industry_ops_model.py -q
      - name: unittest discover
        run: python -m unittest discover -s tests -v
      - name: no secrets
        shell: pwsh
        run: |
          $tracked = git ls-files -- secrets/tmp-creds.json .env .env.local
          if ($tracked) { Write-Error "tracked secrets: $tracked"; exit 1 }
          $mk = 'maker' + '_password'
          $ck = 'checker' + '_password'
          $rx = "CURSOR_API_KEY=\S+|crsr_[a-z0-9]{20,}|`"$mk`"\s*:\s*`"(?!REPLACE_ME)[^`"]+`"|`"$ck`"\s*:\s*`"(?!REPLACE_ME)[^`"]+`""
          $files = Get-ChildItem -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '\\.git\\|node_modules|vendor\\oss|packaging\\out|__pycache__|\.pytest_cache|\\\.github\\|\\\.env|\\secrets\\tmp-creds\.json$'
            }
          $hits = @()
          foreach ($f in $files) {
            $m = Select-String -Path $f.FullName -Pattern $rx -ErrorAction SilentlyContinue
            if ($m) { $hits += $m }
          }
          if ($hits.Count -gt 0) {
            $hits | ForEach-Object { "$($_.Path):$($_.LineNumber)" }
            exit 1
          }
          Write-Host "secret scan clean"
