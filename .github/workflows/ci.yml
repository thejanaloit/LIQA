# Secret grep + same-level + industry gates
name: liqa-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: pytest same-level + industry
        env:
          LIQA_HOME: ${{ github.workspace }}
          LIQA_AGENCY_HOME: ${{ github.workspace }}
        run: python -m pytest tests/test_same_level_contract.py tests/test_industry_ops_model.py -q
      - name: unittest discover
        run: python -m unittest discover -s tests -v
      - name: no secrets
        shell: pwsh
        run: |
          $bad = Select-String -Path (Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch '\\.git\\|node_modules|vendor\\oss|packaging\\out' } | ForEach-Object FullName) -Pattern 'CURSOR_API_KEY=\S+|crsr_[a-z0-9]{20,}' -ErrorAction SilentlyContinue
          if ($bad) { $bad | ForEach-Object { $_.Path + ':' + $_.LineNumber + ':' + $_.Line }; exit 1 }
          Write-Host "secret scan clean"
